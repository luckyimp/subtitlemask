name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Assemble APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Project & Prepare Wrapper
        run: |
          # 自动寻找包含 settings.gradle.kts 的目录（防止将解压后的子目录直接 push 造成路径错层）
          PROJ_DIR=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1 | xargs dirname)
          if [ -z "$PROJ_DIR" ]; then
            PROJ_DIR="."
          fi
          echo "PROJECT_DIR=$PROJ_DIR" >> $GITHUB_ENV
          echo "Detected project root at: $PROJ_DIR"
          cd "$PROJ_DIR"

          # 自动补全 gradle wrapper
          if [ ! -f "gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Initializing Gradle wrapper..."
            gradle wrapper --gradle-version 8.9 --distribution-type bin
          fi
          chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SubtitleMask-Debug-APK
          path: |
            **/app/build/outputs/apk/debug/app-debug.apk
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
